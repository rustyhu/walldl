[package]
name = "walldl"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.11", features = ["socks", "stream"] }
anyhow = "1.0"
indicatif = "0.17"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["net", "process"] }